name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests (committed fixtures only; realdata tests skip)
        run: python -m pytest -q
      - name: Demo scenarios
        run: python -m tracegate.cli demo
      - name: Gate self-check (clean must pass, typosquat must block)
        run: |
          python -m tracegate.cli synth clean events.json
          python -m tracegate.cli gate events.json --comment
          python -m tracegate.cli synth malicious-dep bad.json
          if python -m tracegate.cli gate bad.json; then echo "expected block"; exit 1; fi
      - name: Ed25519 end-to-end (keygen -> sign real Syft/Trivy fixtures -> verify)
        run: |
          python -m tracegate.cli keygen ci
          export TRACEGATE_KEYID=ci TRACEGATE_SIGNING_KEY=ci.key TRACEGATE_PUBKEY=ci.pub
          python -m tracegate.cli ingest --syft tests/fixtures/alpine.syft.json --trivy tests/fixtures/alpine.trivy.json --commit 0000000000000000000000000000000000000000 -o img.json
          python -m tracegate.cli export img.json --format intoto > /dev/null
          python -m tracegate.cli gate img.json --comment || test $? -eq 1

  opa-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Rego policy agrees with the Python DSL
        run: python scripts/opa_parity.py
