name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: make test
      - run: make demo
      - name: Gate self-check (clean must pass, typosquat must block)
        run: |
          python -m tracegate.cli synth clean events.json
          python -m tracegate.cli gate events.json --comment
          python -m tracegate.cli synth malicious-dep bad.json
          if python -m tracegate.cli gate bad.json; then echo "expected block"; exit 1; fi
