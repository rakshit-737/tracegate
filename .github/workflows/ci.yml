name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests (committed fixtures only; realdata tests skip)
        run: python -m pytest -q
      - name: Demo scenarios
        run: python -m tracegate.cli demo
      - name: Gate self-check (demo key; clean must pass, typosquat must block, no key must fail closed)
        shell: bash
        run: |
          python -m tracegate.cli synth clean events.json
          python -m tracegate.cli --demo gate events.json --comment
          python -m tracegate.cli synth malicious-dep bad.json
          if python -m tracegate.cli --demo gate bad.json; then echo "expected block"; exit 1; fi
          set +e; python -m tracegate.cli gate events.json; rc=$?; set -e
          test "$rc" -eq 2 || { echo "gate without keys must exit 2, got $rc"; exit 1; }

  e2e-ed25519:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Signed commit + build + scan stages, verified with the right key and rejected with the wrong one
        run: bash scripts/ci_signed_pipeline.sh

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: pip install build && python -m build
      - name: Install the wheel in a fresh venv and run every subcommand's --help
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/tracegate --version
          for c in synth gate backtrack blast demo bench keygen ingest lineage merge export serve; do
            /tmp/v/bin/tracegate "$c" --help > /dev/null
          done
          /tmp/v/bin/tracegate demo > /dev/null
          set +e; /tmp/v/bin/tracegate keygen /tmp/k 2>err.txt; rc=$?; set -e
          test "$rc" -eq 2 && grep -q "tracegate\[crypto\]" err.txt
      - name: Test suite runs from the unpacked sdist
        run: |
          mkdir /tmp/sd && tar -xzf dist/*.tar.gz -C /tmp/sd
          cd /tmp/sd/tracegate-* && python -m venv .v && .v/bin/pip install -q ".[dev]" && .v/bin/python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke-test the image
        run: |
          docker build -t tracegate:ci .
          docker run -d --name tg -p 127.0.0.1:8080:8080 tracegate:ci
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '[]' http://127.0.0.1:8080/v1/gate)
          test "$code" = 503 || { echo "expected fail-closed 503 without a trust root, got $code"; exit 1; }
          curl -sf -X POST http://127.0.0.1:8080/v1/demo/cve-origin | grep -q '"verdict":"block"'

  opa-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.21.1
      - name: Rego policy agrees with the Python DSL
        run: python scripts/opa_parity.py

  self-gate:
    # Dogfooding: TRACEGATE gates its own container image with real Syft, Trivy, Bandit SARIF and
    # pip-audit output plus the lineage of its pinned docs requirements. The verdict and the PR
    # comment go to the job summary (advisory: base-image CVEs are outside this repo's control).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      SYFT_VERSION: v1.54.0
      TRIVY_VERSION: v0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          pip install -e ".[crypto]" bandit[sarif] pip-audit
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh | sh -s -- -b /usr/local/bin ${SYFT_VERSION}
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh | sh -s -- -b /usr/local/bin ${TRIVY_VERSION}
      - name: Build, SBOM, scan, SAST, dependency audit
        run: |
          docker build -q -t tracegate:self .
          syft tracegate:self -o syft-json=sbom.json
          trivy image -q --format json -o trivy.json tracegate:self
          bandit -q -r tracegate -f sarif -o bandit.sarif || true
          pip-audit -r docs/requirements.txt -f json -o pip-audit.json || true
      - name: Sign stage events and gate them
        run: |
          export TRACEGATE_KEYID=self
          python -m tracegate.cli keygen "$RUNNER_TEMP/self"
          export TRACEGATE_SIGNING_KEY="$RUNNER_TEMP/self.key"
          python -m tracegate.cli lineage . docs/requirements.txt -o commits.json
          python -m tracegate.cli ingest --syft sbom.json --trivy trivy.json --sarif bandit.sarif --commit "$GITHUB_SHA" -o img.json
          python -m tracegate.cli merge commits.json img.json -o events.json
          unset TRACEGATE_SIGNING_KEY
          export TRACEGATE_PUBKEY="$RUNNER_TEMP/self.pub"
          set +e; python -m tracegate.cli gate events.json --comment > comment.md; rc=$?; set -e
          test "$rc" -le 1
          ! grep -q provenance_integrity comment.md
          { echo "exit code: $rc"; echo; head -c 60000 comment.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post the PR comment (same-repo PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file <(head -c 60000 comment.md)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-gate
          path: |
            comment.md
            pip-audit.json
