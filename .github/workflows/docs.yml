name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt -e .
      - name: Rebuild static demo data
        run: python scripts/build_static_demo.py
      - run: mkdocs build --strict
      - name: Parse every Mermaid diagram with mermaid-cli
        run: |
          mkdir -p /tmp/mmd
          python - <<'PY'
          import pathlib, re
          n = 0
          for f in [pathlib.Path("README.md"), *sorted(pathlib.Path("docs").rglob("*.md"))]:
              for i, block in enumerate(re.findall(r"```mermaid
(.*?)```", f.read_text(encoding="utf-8"), re.S)):
                  pathlib.Path(f"/tmp/mmd/{f.stem}-{i}.mmd").write_text(block, encoding="utf-8")
                  n += 1
          print(n, "mermaid blocks")
          PY
          echo '{"args":["--no-sandbox"]}' > /tmp/pptr.json
          for f in /tmp/mmd/*.mmd; do npx -y @mermaid-js/mermaid-cli@11 -p /tmp/pptr.json -i "$f" -o "${f%.mmd}.svg"; done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
