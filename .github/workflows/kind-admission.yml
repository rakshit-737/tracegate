name: kind-admission
# Deploys a Sigstore-signed and an unsigned image to an ephemeral kind cluster through the
# TRACEGATE admission step (cosign keyless verification against this workflow's identity, then
# `tracegate gate` on the signed Syft/Trivy/commit events of that exact image digest).
# Only the signed image may be admitted; a third, cosign-valid image whose signed provenance
# lacks the build/scan stages is denied by TRACEGATE's gate itself. Everything runs inside this runner: a localhost
# registry, a kind cluster, two trivial busybox images holding a dummy file.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
permissions:
  contents: read
jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      REG: localhost:5000
      SYFT_VERSION: v1.54.0
      TRIVY_VERSION: v0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: tg
      - name: Install tracegate, Syft and Trivy
        run: |
          pip install -e ".[crypto]"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh | sh -s -- -b /usr/local/bin ${SYFT_VERSION}
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh | sh -s -- -b /usr/local/bin ${TRIVY_VERSION}
      - name: Build two images and push them to a localhost registry
        run: |
          docker run -d -p 127.0.0.1:5000:5000 --name reg registry:2
          mkdir -p img && cd img
          for v in signed unsigned signed-noscan; do
            echo "tracegate kind demo: $v" > dummy.txt
            printf 'FROM busybox:1.37\nCOPY dummy.txt /dummy.txt\nCMD ["sh","-c","cat /dummy.txt; sleep 3600"]\n' > Dockerfile
            docker build -q -t $REG/tg-app:$v .
            docker push -q $REG/tg-app:$v
            docker inspect --format '{{index .RepoDigests 0}}' $REG/tg-app:$v > ../$v.ref
            kind load docker-image --name tg $REG/tg-app:$v
          done
          cat ../signed.ref ../unsigned.ref ../signed-noscan.ref
      - name: CI stage for the signed image only - keyless signature + signed provenance events
        run: |
          IMG=$(cat signed.ref)
          cosign sign --yes --allow-insecure-registry "$IMG"
          export TRACEGATE_KEYID=ci
          python -m tracegate.cli keygen "$RUNNER_TEMP/ci"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/ci.pub.sigstore.json" "$RUNNER_TEMP/ci.pub" > /dev/null
          syft "$IMG" -o syft-json > sbom.json
          trivy image -q --format json --severity HIGH,CRITICAL -o trivy.json "$IMG"
          export TRACEGATE_SIGNING_KEY="$RUNNER_TEMP/ci.key"
          git config --global user.email ci@example.invalid && git config --global user.name ci
          git init -q app && printf 'requests==2.32.3\n' > app/requirements.txt
          git -C app add . && git -C app commit -q -m "app (#1)"
          python -m tracegate.cli lineage app requirements.txt -o commits.json
          python -m tracegate.cli ingest --syft sbom.json --trivy trivy.json --commit "$(git -C app rev-parse HEAD)" -o img.json
          python -m tracegate.cli merge commits.json img.json -o "events-$(cut -d@ -f2 signed.ref | cut -c8-19).json"
          # Third image: validly Sigstore-signed by this workflow, but its signed provenance has no
          # build/scan stage. cosign accepts it; only TRACEGATE's gate can deny it.
          cosign sign --yes --allow-insecure-registry "$(cat signed-noscan.ref)"
          cp commits.json "events-$(cut -d@ -f2 signed-noscan.ref | cut -c8-19).json"
      - name: Admission through TRACEGATE (only admitted images are applied)
        env:
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/kind-admission\.yml@
        run: |
          export TRACEGATE_KEYID=ci TRACEGATE_PUBKEY="$RUNNER_TEMP/ci.pub" \
                 TRACEGATE_PUBKEY_BUNDLE="$RUNNER_TEMP/ci.pub.sigstore.json" TRACEGATE_SIGSTORE_IDENTITY="$IDENTITY"
          echo '[]' > decisions.json
          for v in signed unsigned signed-noscan; do
            IMG=$(cat $v.ref); short=$(cut -d@ -f2 $v.ref | cut -c8-19)
            reason=""; allowed=false
            if ! cosign verify --allow-insecure-registry --certificate-identity-regexp "$IDENTITY" \
                 --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMG" > /dev/null 2> cosign-$v.err; then
              reason="no Sigstore signature from $IDENTITY: $(tail -1 cosign-$v.err)"
            elif [ ! -f "events-$short.json" ]; then
              reason="no signed provenance events for digest $short"
            elif ! python -m tracegate.cli gate "events-$short.json" --comment > gate-$v.md 2> gate-$v.err; then
              reason="tracegate gate blocked: $(grep -m1 '\[block\]' gate-$v.md || tail -1 gate-$v.err)"
            else
              allowed=true
            fi
            python - "$v" "$IMG" "$allowed" "$reason" <<'PY'
          import json, sys
          d = json.load(open("decisions.json"))
          d.append({"deployment": sys.argv[1], "image": sys.argv[2], "allowed": sys.argv[3] == "true",
                    "reason": sys.argv[4] or "signed by trusted workflow; gate passed"})
          json.dump(d, open("decisions.json", "w"), indent=1)
          PY
            if $allowed; then
              kubectl create deployment tg-$v --image="$REG/tg-app:$v"
              kubectl patch deployment tg-$v --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}]'
            else
              echo "DENIED tg-$v: $reason"
            fi
          done
          cat decisions.json
      - name: Assert only the signed image runs
        run: |
          kubectl rollout status deployment/tg-signed --timeout=120s
          kubectl get pods -l app=tg-signed -o jsonpath='{.items[0].status.phase}' | grep -qx Running
          for v in unsigned signed-noscan; do
            if kubectl get deployment tg-$v 2>/dev/null; then echo "$v image was admitted"; exit 1; fi
          done
          python -c "import json;d={x['deployment']:x for x in json.load(open('decisions.json'))};assert d['signed']['allowed'] and not d['unsigned']['allowed'] and not d['signed-noscan']['allowed'];assert d['signed-noscan']['reason'].startswith('tracegate gate blocked'), d['signed-noscan'];print('admission OK')"
          kubectl get pods -o wide | tee pods.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-admission
          path: |
            decisions.json
            pods.txt
            gate-*.md
            cosign-*.err
