[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegate"
version = "1.1.0"
description = "Provenance-aware CI/CD security gate: signed SBOM lineage graph, finding->commit backtracking, reachability triage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rakshit" }]
requires-python = ">=3.10"
dependencies = []  # the core gate is stdlib-only
keywords = ["sbom", "slsa", "supply-chain", "provenance", "devsecops", "syft", "trivy", "osv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
crypto = ["cryptography>=42"]            # Ed25519 signing
osv = ["packaging>=23"]                  # OSV range matching
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
neo4j = ["neo4j>=5"]
bench = ["matplotlib>=3.8", "packaging>=23"]
dev = ["pytest>=7", "ruff>=0.16,<0.17", "cryptography>=42", "packaging>=23", "fastapi>=0.110", "uvicorn>=0.29",
       "httpx>=0.27"]

[project.scripts]
tracegate = "tracegate.cli:main"

[project.urls]
Homepage = "https://github.com/rakshit-737/tracegate"

[tool.setuptools]
packages = ["tracegate", "tracegate.ui"]

[tool.setuptools.package-data]
tracegate = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs datasets from scripts/download_data.py (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D1"]
# D1: every public module, class and function in tracegate/ has a docstring (CI enforces it)
ignore = ["E501", "B008", "UP007", "B905", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"!tracegate/**" = ["D1"]
